[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luk-replay-lab"
version = "0.1.0"
description = "Offline, deterministic educational trading-system replay"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.100,<1",
  "uvicorn>=0.20,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "playwright>=1.56,<2", "httpx>=0.25,<1"]
data = ["yfinance>=0.2,<1"]  # Optional: never imported by offline replay/server.

[project.scripts]
luk-replay = "luk_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luk_replay = ["web/templates/*.html", "web/static/*.js", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
